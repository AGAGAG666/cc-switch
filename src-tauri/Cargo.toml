[package]
name = "cc-switch"
version = "3.19.1"
description = "All-in-One Assistant for Claude Code, Codex & Gemini CLI"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/farion1231/cc-switch"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cc_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = []
test-hooks = []

[build-dependencies]
# 注意：build-dependencies 的 target cfg 按「宿主」求值，交叉编译时无法用它
# 排除 android，因此这里保持无条件引入（宿主侧总能编译），由 build.rs 读
# CARGO_CFG_TARGET_OS 决定是否真的调用 tauri_build::build()。
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"
flate2 = "1"
brotli = "7"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
webpki-roots = "0.26"
rustls-native-certs = "0.8"
regex = "1.10"
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
thiserror = "2.0"
anyhow = "1.0"
serde_yaml = "0.9"
tempfile = "3"
url = "2.5"
once_cell = "1.21.3"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
indexmap = { version = "2", features = ["serde"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
json5 = "0.4"
json-five = "0.3.1"
sys-locale = "0.3"

# ─── 桌面（非 Android）───────────────────────────────────────────
# 真实 Tauri 与桌面插件。Android 上由 `android/` 下的同名替身 crate 顶替，
# 见下方 `cfg(target_os = "android")` 段。这里的写法与上游保持逐字一致，
# 以便 rebase 时不产生无意义冲突。
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2.8.2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
arboard = "3.6"
auto-launch = "0.5"
# rustls 栈：桌面保持上游原样（default features 含 aws-lc-rs）。
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-tokio"] }
tokio-rustls = "0.26"
rustls = "0.23"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "socks"] }
zip = "2.2"

# ─── Android sidecar ───────────────────────────────────────────
# 替身 crate。这里**不能**用 `tauri = { package = "tauri-shim", .. }` 的写法：
# cargo 硬性要求「同一个依赖名在所有 target 下必须指向同一个源」，否则报
#   Dependency 'arboard' has different source paths depending on the build target.
# 因此 Android 段的依赖名必须与桌面段不同（用替身包自己的名字），
# 而 `commands/` 里 `tauri::` / `arboard::` 这些**路径不变**的原因是：
# 未使用 `package` 重命名时，extern crate 名取自被依赖包的 `[lib] name`，
# 各替身已分别把 lib name 设为 tauri / arboard / auto_launch /
# tauri_plugin_{opener,dialog,store,updater}。
# 于是 `commands/`（35 文件）、`proxy/`、`services/` 一行不改即可编译。
# 替身的接缝已由 `android/shim-selftest` 的 20 项断言覆盖。
#
# 未列出的 tauri-plugin-log / -process / -deep-link / -window-state /
# -single-instance 只在 `lib.rs` 的桌面 bootstrap 中使用，Android 上整体
# cfg 掉，因此无需替身。
[target.'cfg(target_os = "android")'.dependencies]
tauri-shim = { path = "android/tauri-shim" }
tauri-plugin-opener-shim = { path = "android/tauri-plugin-opener" }
tauri-plugin-dialog-shim = { path = "android/tauri-plugin-dialog" }
tauri-plugin-store-shim = { path = "android/tauri-plugin-store" }
tauri-plugin-updater-shim = { path = "android/tauri-plugin-updater-shim" }
arboard-shim = { path = "android/arboard-shim" }
auto-launch-shim = { path = "android/auto-launch-shim" }
# rustls 栈：必须显式 default-features = false 以踢掉 aws-lc-rs。
# aws-lc-sys 0.36 的 getentropy 调用要求 API >= 28，在 API 24 的 NDK sysroot 下
# 直接编译失败（error: call to undeclared function 'getentropy'）。
# 代码里本来就只用 rustls::crypto::ring::default_provider()，改用 ring 无行为差异，
# 顺带省掉 aws-lc 的一大坨 C 代码体积。
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "tls12",
    "ring",
    "webpki-tokio",
    "logging",
] }
# NDK 无系统 openssl：必须关掉 reqwest 的 default-tls，显式补回
# 默认特性里仍需要的 charset / http2，避免行为与桌面产生差异。
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "socks",
    "charset",
    "http2",
] }
# zip 的默认特性含 lzma 等需要 C 工具链的后端，交叉编译会失败；
# 只保留仓库实际用到的压缩方式。
zip = { version = "2.2", default-features = false, features = [
    "deflate",
    "bzip2",
    "zstd",
    "time",
] }
# rquickjs-sys 没有 android 的预生成绑定，必须现场 bindgen
# （上游对 Windows aarch64 同样这么处理，见下方 target 段）。
rquickjs = { version = "0.8", features = ["bindgen"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_16"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
rquickjs = { version = "0.8", features = ["bindgen"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSColor"] }

# Optimize release binary size to help reduce AppImage footprint
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
