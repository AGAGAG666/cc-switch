[package]
name = "tauri-shim-macros"
version = "0.1.0"
edition = "2021"
publish = false
description = "Proc macros reproducing tauri's #[command] / generate_handler! for the Android sidecar"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
