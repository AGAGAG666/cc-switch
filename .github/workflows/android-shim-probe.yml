---
name: Android Shim Probe

# 单独编译 src-tauri/android 下的 tauri 替身 crate。
# 先在宿主 target 上把类型错误清干净（shim 是纯 Rust，无原生依赖），
# 再验证 aarch64-linux-android 交叉编译。
on:
  push:
    branches: [android-sidecar]
    paths:
      - 'src-tauri/android/**'
      - '.github/workflows/android-shim-probe.yml'
  workflow_dispatch:

jobs:
  shim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri/android
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        run: |
          rustup toolchain install 1.95 --profile minimal --component clippy
          rustup default 1.95
          rustup target add aarch64-linux-android
          rustc --version

      - name: 宿主编译（清类型错误）
        run: |
          set -o pipefail
          cargo build --all 2>&1 | tail -200

      - name: 宏展开自测（真实命令形态 + 运行断言）
        run: |
          set -o pipefail
          cargo test --all -- --nocapture 2>&1 | tail -120

      - name: 交叉编译 aarch64-linux-android
        run: |
          ndk_root="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"
          TC="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          set -o pipefail
          cargo build --all --target aarch64-linux-android 2>&1 | tail -100

      - name: clippy（仅提示，不阻断）
        run: cargo clippy --all 2>&1 | tail -80 || true

      - name: 验证 src-tauri 对 shim 的跨 workspace path 依赖能解析
        working-directory: src-tauri
        run: |
          set -o pipefail
          # 只解析依赖图，不编译。几秒内就能暴露 workspace 归属冲突、
          # 重命名写错、路径写错等问题。
          cargo metadata --format-version 1 --filter-platform aarch64-linux-android \
            --no-deps > /dev/null
          echo "--- android 目标下 tauri 解析到哪个包 ---"
          cargo tree --target aarch64-linux-android -e normal -p cc-switch -d 2>/dev/null | head -5 || true
          cargo tree --target aarch64-linux-android -e normal -i tauri-shim 2>&1 | head -20
          echo "--- 确认 openssl-sys 未混入 ---"
          cargo tree --target aarch64-linux-android -e normal > tree.txt
          if grep -q 'openssl-sys' tree.txt; then
            echo "::error::openssl-sys 被引入，Android 无系统 openssl"
            grep -n -B6 'openssl-sys' tree.txt | head -40
            exit 1
          fi
          echo "openssl-sys 未引入 (ok)"
          echo "--- 确认真实 tauri 未混入 android 依赖图 ---"
          if grep -qE '^[^a-z]*tauri v2' tree.txt; then
            echo "::error::真实 tauri crate 出现在 android 依赖图中"
            grep -n 'tauri v2' tree.txt | head -10
            exit 1
          fi
          echo "真实 tauri 未混入 (ok)"
